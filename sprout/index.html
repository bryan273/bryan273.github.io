<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprout 芽伴 | Learn by teaching</title>
<meta name="description" content="Sprout is an AI friend that learners of every age teach (3-15). The learner explains a lesson in their own words; Sprout asks one question and remembers only what they said.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">🌱</span><b>Sprout 芽伴</b><span id="brain" class="badge"></span></div>
  <div class="top-r">
    <span id="stars" class="pill" title="stars">⭐ 0</span>
    <button id="speakBtn" class="ico" title="voice">🔊</button>
    <button id="settingsBtn" class="ico" title="AI">⚙️</button>
    <button id="langBtn" class="ico txt">EN</button>
    <button id="parentBtn" class="ico" title="parent">👨‍👩‍👧</button>
  </div>
</header>

<main id="app">
  <!-- HOME -->
  <section id="home" class="view">
    <div id="stagePick" class="stagepick"></div>
    <div class="hero">
      <div id="heroMascot" class="hero-m"></div>
      <div class="hero-t">
        <div class="bubble big" id="heroBubble"></div>
        <div class="steps-row" id="stepsRow"></div>
      </div>
    </div>
    <div id="lessonList" class="grid"></div>
    <div class="home-foot">
      <button id="consentBtn" class="soft"></button>
      <span id="grown" class="note"></span>
    </div>
  </section>

  <!-- LESSON -->
  <section id="lesson" class="view hidden">
    <nav id="steps" class="stepper"></nav>
    <p id="stageNote" class="stagenote hidden"></p>

    <!-- learn -->
    <div id="learnPane" class="pane">
      <div class="learn-top"><h2 id="lessonTitle"></h2><span id="lessonSub" class="chip"></span></div>
      <div class="viewer">
        <button id="prevCard" class="round" aria-label="prev">◀</button>
        <div class="card-big">
          <div id="cardArt" class="art"></div>
          <div class="card-text"><span id="cardText"></span><button id="cardSay" class="ico">🔊</button></div>
        </div>
        <button id="nextCard" class="round" aria-label="next">▶</button>
      </div>
      <div id="dots" class="dots"></div>
      <div class="center"><button id="startTeach" class="primary big"></button></div>
    </div>

    <!-- teach / new example -->
    <div id="teachPane" class="pane hidden">
      <div class="teach-grid">
        <div class="stage">
          <div id="newCard" class="newcard hidden"><div id="newArt" class="art small"></div><p id="newQ"></p></div>
          <div class="yaya-row">
            <div id="mascotBox" class="mascot-box"></div>
            <div class="talk">
              <div id="meSaid" class="said hidden"></div>
              <div id="bubble" class="bubble"></div>
            </div>
          </div>
          <div id="banner" class="banner hidden"></div>
          <div class="controls">
            <button id="hintBtn" class="soft">💡 <span data-i="stuck"></span></button>
            <button id="micBtn" class="mic" aria-label="mic"><span class="wave"><i></i><i></i><i></i><i></i><i></i></span><span class="micico">🎤</span></button>
            <button id="kbBtn" class="soft">⌨️</button>
          </div>
          <div id="typeRow" class="type-row hidden">
            <textarea id="input" rows="2"></textarea>
            <div class="row"><button id="demoBtn" class="soft">✨ <span data-i="demo"></span></button><button id="sendBtn" class="primary">➤ <span data-i="send"></span></button></div>
          </div>
          <p id="micHint" class="note center"></p>
          <div class="center"><button id="toNew" class="primary big hidden"></button></div>
        </div>
        <aside class="brainbox">
          <h3>🧠 <span data-i="brainT"></span></h3>
          <div id="brainGrid" class="brain-grid"></div>
          <p class="note" data-i="brainNote"></p>
        </aside>
      </div>
    </div>

    <!-- quiz + exam -->
    <div id="quizPane" class="pane hidden">
      <div class="tabs"><button id="tabAsk" class="tab on"></button><button id="tabExam" class="tab"></button></div>
      <div id="askBox">
        <div class="yaya-row small"><div id="quizMascot" class="mascot-box"></div><div class="talk"><div id="quizBubble" class="bubble"></div></div></div>
        <div class="type-row open">
          <textarea id="quizInput" rows="2"></textarea>
          <div class="row"><button id="quizMic" class="soft">🎤</button><button id="quizSend" class="primary">❓ <span data-i="ask"></span></button></div>
        </div>
        <div id="quizCites" class="cites"></div>
      </div>
      <div id="examBox" class="hidden">
        <div class="center"><button id="runExam" class="primary big"></button></div>
        <div id="examScore" class="score hidden"></div>
        <div id="examList" class="exam-list"></div>
      </div>
    </div>
  </section>

  <!-- PARENT -->
  <section id="parent" class="view hidden">
    <button id="backBtn" class="soft" data-i="back"></button>
    <h1 data-i="parentTitle"></h1>
    <div id="parentBody"></div>
  </section>
</main>

<div id="modal" class="modal hidden"><div class="box">
  <h3 data-i="setTitle"></h3>
  <p class="note" data-i="setNote"></p>
  <label data-i="setKey"></label><input id="cfgKey" type="password" autocomplete="off" placeholder="sk-...">
  <label>Base URL</label><input id="cfgBase">
  <label>Model</label><input id="cfgModel">
  <p id="cfgMsg" class="note"></p>
  <div class="row"><button id="cfgTest" class="soft" data-i="setTest"></button><button id="cfgClear" class="soft" data-i="setClear"></button><button id="cfgSave" class="primary" data-i="setSave"></button></div>
</div></div>

<div id="consentModal" class="modal hidden"><div class="box">
  <h3>👨‍👩‍👧 <span data-i="consentT"></span></h3>
  <p data-i="consent"></p>
  <ul class="plist" id="privList"></ul>
  <div class="row"><button id="consentNo" class="soft" data-i="no"></button><button id="consentYes" class="primary" data-i="yes"></button></div>
</div></div>

<div id="confetti"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
